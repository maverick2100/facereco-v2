# Camera definitions.
#
# Tips for low CPU on a Mac mini M4 with 20 cameras:
#  * Use each camera's SUB-STREAM (e.g. 640x360 / 1280x720 H.264). Decoding 20 main
#    streams (4K/1080p) wastes the media engine and memory bandwidth.
#  * `fps` is what reaches Python; GStreamer drops everything else after the
#    hardware decoder. 3-5 fps is plenty for face recognition at entrances.
#  * width/height should match the stream resolution (scaling costs CPU).
#  * Use test://ball or file:///path/video.mp4 as url for testing.
#
# `tasks` picks what runs on each camera (the stream is decoded only once):
#    tasks: [face]           face recognition (SCRFD + ArcFace)
#    tasks: [person]         person detection + counting (YOLOv7) -> person_counts table
#    tasks: [face, person]   both
#
# IN / OUT counting (person cameras): a straight line `roi: [x1, y1, x2, y2]` (its two ends).
# A person whose feet cross the line in `in_direction` (down | up | right | left, default down)
# is one IN; the opposite direction is one OUT. Each person is counted once.
# Points are pixels in the delivered resolution, or 0..1 fractions of width/height:
#    roi: [0.0, 0.6, 1.0, 0.6]      # horizontal line across the frame, 60% down
#    in_direction: down
# Totals go to tbl_person_counts (one In + one Out row per device per day).

defaults:
  codec: h264          # h264 | h265 | auto
  decoder: vtdec       # VideoToolbox hardware decoder
  width: 1280
  height: 720
  fps: 4
  latency_ms: 200
  transport: tcp
  priority: 1.0
  enabled: true
  tasks: [face]

cameras:
